[package]
name = "vyomad"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
description = "Vyoma Daemon for managing secure virtual machines"

[lib]
name = "vyomad"
path = "src/lib.rs"

[[bin]]
name = "vyomad"
path = "src/main.rs"

[features]
default = []
chaos = []

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vyoma-core = { path = "../vyoma-core" }
vyoma-storage = { path = "../vyoma-storage" }
vyoma-image = { path = "../vyoma-image" }
vyoma-build = { path = "../vyoma-build" }
vyoma-agent-protocol = { path = "../vyoma-agent-protocol" }
serde.workspace = true
serde_json.workspace = true
axum = "0.7"
anyhow.workspace = true
tempfile.workspace = true
uuid = { version = "1.7", features = ["v4"] }
rand = "0.8"
dirs = "5.0"
futures.workspace = true
tokio-stream = { version = "0.1.17", features = ["sync"] }
tar.workspace = true
flate2.workspace = true
tokio-util = { version = "0.7.17", features = ["io"] }
simple-dns = "0.11.0"
http = "1.0"
rust-embed = "8.2"
mime_guess = "2.0"
tower-http = { version = "0.5", features = ["cors"] }
libc = "0.2.180"
reqwest = { version = "0.13.1", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }
nix = { version = "0.28", features = ["signal", "process", "fs", "sched"] }
caps = "0.5"
thiserror = "1.0"

sled = "0.34"
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
hyper = "1.8.1"
tower-service = "0.3.3"
prometheus.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tonic = "0.11"
prost = "0.12"
vyoma-proto = { path = "../vyoma-proto" }
async-trait = "0.1.89"
vyoma-teleport = { path = "../vyoma-teleport" }
vyoma-net = { path = "../vyoma-net" }

[dev-dependencies]
mockall = "0.14"
rand = "0.8"

[package.metadata.deb]
maintainer = "Subeshrock <subesh.rock.3@gmail.com>"
copyright = "2026, Vyoma Contributors"
license-file = ["../../LICENSE", "4"]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/vyomad", "usr/local/bin/vyomad", "755"],
    ["target/release/vyoma", "usr/local/bin/vyoma", "755"],
    ["../../bin/vyoma-agent-vm", "var/lib/vyoma/bin/vyoma-agent-vm", "755"],
    ["../../bin/cloud-hypervisor", "var/lib/vyoma/bin/cloud-hypervisor", "755"],
    ["../../bin/vmlinux", "var/lib/vyoma/bin/vmlinux", "644"],
    ["systemd/vyomad.service", "etc/systemd/system/vyomad.service", "644"]
]
maintainer-scripts = "../../packaging/debian"

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/vyomad", dest = "/usr/local/bin/vyomad", mode = "755" },
    { source = "../../target/release/vyoma", dest = "/usr/local/bin/vyoma", mode = "755" },
    { source = "../../bin/vyoma-agent-vm", dest = "/var/lib/vyoma/bin/vyoma-agent-vm", mode = "755" },
    { source = "../../bin/cloud-hypervisor", dest = "/var/lib/vyoma/bin/cloud-hypervisor", mode = "755" },
    { source = "../../bin/vmlinux", dest = "/var/lib/vyoma/bin/vmlinux", mode = "644" },
    { source = "systemd/vyomad.service", dest = "/etc/systemd/system/vyomad.service", mode = "644" }
]
pre_install_script = "../../packaging/rpm/preinst"
post_install_script = "../../packaging/rpm/postinst"
pre_uninstall_script = "../../packaging/rpm/preun"