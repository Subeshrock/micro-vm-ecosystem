name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential rpm libssl-dev protobuf-compiler libdevmapper-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        run: |
            cd ui
            npm install
            npm run build
            cd ..

      - name: Install Packaging Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build Debian Package
        run: make deb

      - name: Build RPM Package
        run: make rpm

      - name: Verify Packages
        run: |
          echo "DEB files:" && ls -la target/debian/*.deb || echo "No DEB files found"
          echo "RPM files:" && ls -la crates/vyomad/target/generate-rpm/*.rpm || echo "No RPM files found"

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/debian/*.deb
            crates/vyomad/target/generate-rpm/*.rpm
          generate_release_notes: true
          draft: false
          prerelease: false
